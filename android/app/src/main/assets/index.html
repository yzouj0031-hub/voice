<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="stylesheet" href="style.css" />
  <title>语音助手</title>
</head>
<body>
  <header class="topbar">
    <span class="title">语音助手</span>
    <div class="top-actions">
      <button id="clearBtn" class="icon-btn" title="清空对话">清空</button>
      <button id="settingsBtn" class="icon-btn" title="设置" aria-label="设置">⚙️</button>
    </div>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <section class="dock">
    <p id="status" class="status">点击麦克风开始说话</p>
    <button id="micBtn" class="mic" aria-label="按下说话">
      <span class="mic-ring"></span>
      <svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true">
        <path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
        <path fill="currentColor" d="M19 12a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-2.06A9 9 0 0 0 21 12h-2Z"/>
      </svg>
    </button>
    <button id="stopSpeakBtn" class="stop-speak hidden" aria-label="停止朗读">⏹ 停止朗读</button>
  </section>

  <!-- 设置弹窗 -->
  <div id="settings" class="modal hidden">
    <div class="sheet">
      <h2>设置</h2>
      <label>接口类型
        <select id="s_provider">
          <option value="openai">OpenAI 兼容（通用）</option>
          <option value="anthropic">Anthropic（原生 Claude）</option>
        </select>
      </label>
      <label>接口地址
        <input id="s_baseUrl" type="url" placeholder="https://api.deepseek.com/v1" autocomplete="off" autocapitalize="off" spellcheck="false" />
      </label>
      <label>API 密钥
        <input id="s_apiKey" type="password" placeholder="sk-..." autocomplete="off" autocapitalize="off" spellcheck="false" />
      </label>
      <label>模型名
        <input id="s_model" type="text" placeholder="deepseek-chat" autocomplete="off" autocapitalize="off" spellcheck="false" />
      </label>
      <label>人设 / 系统提示词
        <textarea id="s_system" rows="3"></textarea>
      </label>
      <p class="tip">常见填法：DeepSeek → 地址 https://api.deepseek.com/v1，模型 deepseek-chat；Kimi → https://api.moonshot.cn/v1，moonshot-v1-8k；Claude → 接口类型选 Anthropic，地址 https://api.anthropic.com，模型 claude-haiku-4-5。</p>
      <div class="sheet-actions">
        <button id="s_cancel" class="btn ghost">取消</button>
        <button id="s_save" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
